# Supabase Projekt CUMO DRIVE. Über die GitHub Integration spielt Supabase bei jedem Push auf
# main die Migrationen und die hier deklarierten Edge Functions ein.
project_id = "cumo-drive"

[functions.pass-status]
# Öffentlich aufrufbar; die Funktion fragt TomTom höchstens alle 2 Stunden ab.
verify_jwt = false

[functions.road-closures]
# Öffentlich aufrufbar wie pass-status; liefert nur Sperrungen, je Kachel höchstens alle 10 Minuten TomTom
verify_jwt = false

[functions.notify]
# Wird nur von Datenbank Triggern (pg_net) aufgerufen, ohne JWT. Schutz über den Header x-notify-secret
# (Edge Function Secret NOTIFY_SECRET, gleicher Wert im Vault unter notify_secret).
verify_jwt = false

[functions.livekit-token]
# Zugang zum Funk: nur mit Anmeldung, die Funktion prüft zusätzlich die Mitgliedschaft in der Fahrt.
verify_jwt = true

[functions.feedback-inbox]
# Eingang der Rückmeldungen für Claudes Prüfläufe (Koray 16.11.): ohne JWT, Schutz über den Header x-feedback-key
# (Edge Function Secret FEEDBACK_KEY, trägt Koray selbst ein). Lesen und Status setzen, sonst nichts.
verify_jwt = false

[functions.road-data]
# Strecken, Pässe und Empfehlungen für den Web Planer (Koray 16.11.): nur mit Anmeldung, mit Fingerabdruck je Konto.
verify_jwt = true

[functions.revenuecat-webhook]
# Kauf Ereignisse von RevenueCat (Koray 17.11.): ohne JWT, Schutz über den Authorization Header
# (Edge Function Secret REVENUECAT_WEBHOOK_AUTH, gleicher Wert im RevenueCat Webhook, trägt Koray selbst ein).
verify_jwt = false
