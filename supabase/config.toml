# Supabase Projekt CUMO DRIVE. Über die GitHub Integration spielt Supabase bei jedem Push auf
# main die Migrationen und die hier deklarierten Edge Functions ein.
project_id = "cumo-drive"

[functions.pass-status]
# Öffentlich aufrufbar; die Funktion fragt TomTom höchstens alle 2 Stunden ab.
verify_jwt = false

[functions.road-closures]
# Öffentlich aufrufbar wie pass-status; liefert nur Sperrungen, je Kachel höchstens alle 10 Minuten TomTom
verify_jwt = false

[functions.notify]
# Wird nur von Datenbank Triggern (pg_net) aufgerufen, ohne JWT. Schutz über den Header x-notify-secret
# (Edge Function Secret NOTIFY_SECRET, gleicher Wert im Vault unter notify_secret).
verify_jwt = false
